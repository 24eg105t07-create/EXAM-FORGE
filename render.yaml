services:
  # 1. Spring Boot Backend Web Service
  - type: web
    name: examforge-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: dev
      - key: AI_PROVIDER
        value: LOCAL_DEMO
      - key: PORT
        value: "10000"

  # 2. React Vite Frontend Static Site
  - type: web
    name: examforge-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://examforge-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
